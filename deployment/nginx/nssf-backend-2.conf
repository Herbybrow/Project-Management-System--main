# HTTP port 8001 remains available; PHP executes via an isolated FPM socket.
server {
    listen 8001;
    listen [::]:8001;
    server_name 147.182.164.148;
    root /var/www/nssf-project-mgmt-2/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/nssf-backend-2.access.log;
    error_log /var/log/nginx/nssf-backend-2.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/nssf-site2.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Only Laravel's front controller may execute; private files have no alias.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
