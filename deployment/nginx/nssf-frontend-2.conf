# New Site 2 virtual host only. Review with the administrator before enabling.
server {
    listen 8080;
    listen [::]:8080;
    server_name 147.182.164.148;
    root /var/www/nssf-frontend-2;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/nssf-frontend-2.access.log;
    error_log /var/log/nginx/nssf-frontend-2.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 2;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # No API proxy is enabled: this preserves the PDF's two public origins.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
}
