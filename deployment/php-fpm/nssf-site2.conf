; Proposal for a new pool in the already-installed PHP-FPM service.
; Administrator must create the dedicated nssf2 user/group before enabling.
; Do not replace Site 1's pool or global FPM settings.
[nssf_site2]
user = nssf2
group = nssf2
listen = /run/php/nssf-site2.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
pm.max_requests = 300

catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/nssf-project-mgmt-2/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
; Set pm.max_children from measured worker RSS and Site 2's allocated RAM.
; Validate large DOCX/ZIP exports within memory_limit before accepting it.
